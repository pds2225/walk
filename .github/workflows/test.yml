name: test

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:run

      - name: Lint
        run: npm run lint

      - name: Typecheck (packages/)
        run: npm run typecheck

      # web 의 tsc 는 @walk/route-engine 을 workspace 패키지로 resolve 하는데,
      # 그건 dist/ 산출물(package.json 의 main/types)을 통해서다 — 소스가 아니라.
      # (테스트는 vitest.config.ts 의 alias 로 소스를 직접 보므로 이 빌드가 필요 없다.)
      - name: Build route-engine
        run: npm run build --workspace @walk/route-engine

      - name: Typecheck (web)
        run: npm run typecheck --workspace web

      - name: Build web
        run: npm run next:build
